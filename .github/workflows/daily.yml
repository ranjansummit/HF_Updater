name: Daily NEPSE Fetch
on:
  schedule:
    - cron: '15 10 * * *'   # 10:15 UTC = 16:00 Nepal time
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install requests pandas pyarrow huggingface_hub
      - env:
          HF_TOKEN:   ${{ secrets.HF_TOKEN }}
          HF_REPO_ID: ${{ secrets.HF_REPO_ID }}
        run: python daily_fetch.py
