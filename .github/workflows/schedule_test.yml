name: Run Kaggle notebook

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  run-kaggle:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    env:
      KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
      KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}

      # Change to the exact slug from your notebook URL.
      NOTEBOOK_SLUG: kaggletest

    steps:
      - name: Install Kaggle CLI
        run: python -m pip install --upgrade kaggle

      - name: Set notebook identifier
        run: |
          echo "NOTEBOOK=${KAGGLE_USERNAME}/${NOTEBOOK_SLUG}" >> "$GITHUB_ENV"

      - name: Download notebook code and metadata
        run: |
          mkdir -p notebook
          kaggle kernels pull "$NOTEBOOK" -p notebook -m

      - name: Start notebook on Kaggle
        run: kaggle kernels push -p notebook

      - name: Wait for Kaggle result
        shell: bash
        run: |
          for attempt in $(seq 1 35); do
            sleep 30

            status="$(kaggle kernels status "$NOTEBOOK")"
            printf '%s\n' "$status"

            case "${status,,}" in
              *complete*)
                echo "SUCCESS: Kaggle notebook completed."
                exit 0
                ;;
              *error*|*failed*|*cancel*)
                echo "FAIL: Kaggle notebook failed. See execution logs."
                exit 1
                ;;
            esac
          done

          echo "TIMEOUT: Kaggle did not finish within the waiting period."
          exit 1

      - name: Show Kaggle execution logs
        if: always() && env.NOTEBOOK != ''
        continue-on-error: true
        run: kaggle kernels logs "$NOTEBOOK"
