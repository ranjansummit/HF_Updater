name: Weekly NEPSE filler

on:
  schedule:
    - cron: '15 10 * * 6'
  workflow_dispatch:
    inputs:
      week_of:
        description: 'Optional YYYY-MM-DD within one week (blank = current Nepal week)'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: nepse-daily-pipeline
  cancel-in-progress: false

jobs:
  fill:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HF_REPO_ID: ranjansummit/nepse_floorsheet
      HF_INDEX_REPO_ID: ranjansummit/dailyindices
      HF_AGG_REPO_ID: ranjansummit/aggregatedindices
      PYTHONUNBUFFERED: '1'
      WEEK_OF: ${{ inputs.week_of }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: python -m pip install requests 'pandas>=2.2,<3' 'numpy<3' wasmtime 'pyarrow>=15' 'huggingface_hub>=0.27,<2' scikit-learn==1.6.1 joblib

      - name: Fill selected week
        shell: bash
        run: |
          args=()
          if [[ -n "$WEEK_OF" ]]; then args+=(--week-of "$WEEK_OF"); fi
          python weeklyfiller.py "${args[@]}"
