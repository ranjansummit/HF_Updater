name: Daily NEPSE Fetch, Aggregate and Train

on:
  schedule:
    - cron: '15 10 * * *' # 10:15 UTC = 16:00 Nepal time
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nepse-daily-pipeline
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HF_REPO_ID: ranjansummit/dailyindices
      HF_INDEX_REPO_ID: ranjansummit/dailyindices
      HF_AGG_REPO_ID: ranjansummit/testing
      HF_MODEL_REPO_ID: ranjansummit/nepse-p33-models
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install \
            requests \
            "pandas>=2.2,<3" \
            "numpy<3" \
            "pyarrow>=15" \
            "huggingface_hub>=0.27,<2" \
            "scikit-learn==1.6.1" \
            joblib

      - name: Fetch, aggregate, train and publish
        run: python dailyfetch_test.py --yes
